<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">故意错误的无关柱状图</title>
  <desc id="desc">与决策树无关，且其标题、图例和标签故意相互重叠。</desc>
  <style>
    .axis { stroke: #485866; stroke-width: 2; }
    .grid { stroke: #dce5eb; stroke-width: 1; }
    .bar1 { fill: #4f81bd; }
    .bar2 { fill: #f4d99c; }
    .main { font: 700 31px 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #174f84; }
    .text { font: 500 20px 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #192b37; }
    .tiny { font: 500 16px 'Noto Sans CJK SC', 'PingFang SC', sans-serif; fill: #192b37; }
  </style>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="40" y="52" class="main">错误重绘：不同仓库/语言的解决率</text>
  <rect x="420" y="25" width="380" height="52" fill="#ffffff" opacity="0.86"/>
  <rect x="440" y="41" width="18" height="18" class="bar1"/><text x="466" y="57" class="text">蓝：常规任务</text>
  <rect x="635" y="41" width="18" height="18" class="bar2"/><text x="661" y="57" class="text">黄：大补丁 / 多文件</text>
  <line x1="100" y1="450" x2="860" y2="450" class="axis"/>
  <line x1="100" y1="110" x2="100" y2="450" class="axis"/>
  <line x1="100" y1="180" x2="860" y2="180" class="grid"/>
  <line x1="100" y1="280" x2="860" y2="280" class="grid"/>
  <line x1="100" y1="380" x2="860" y2="380" class="grid"/>
  <text x="34" y="112" class="text">解决率</text>
  <rect x="170" y="205" width="58" height="245" class="bar1"/><rect x="232" y="262" width="58" height="188" class="bar2"/>
  <rect x="340" y="245" width="58" height="205" class="bar1"/><rect x="402" y="294" width="58" height="156" class="bar2"/>
  <rect x="510" y="276" width="58" height="174" class="bar1"/><rect x="572" y="322" width="58" height="128" class="bar2"/>
  <rect x="680" y="316" width="58" height="134" class="bar1"/><rect x="742" y="345" width="58" height="105" class="bar2"/>
  <text x="174" y="482" class="text" transform="rotate(-28 174 482)">Python</text>
  <text x="346" y="482" class="text" transform="rotate(-28 346 482)">JS</text>
  <text x="514" y="482" class="text" transform="rotate(-28 514 482)">Java</text>
  <text x="678" y="482" class="text" transform="rotate(-28 678 482)">C++</text>
  <text x="466" y="136" class="text">10+ 文件：50% 以上仍需人工复核，误差高</text>
  <line x1="590" y1="93" x2="590" y2="168" stroke="#168f8c" stroke-width="4"/>
  <text x="480" y="535" class="tiny">图注：此自绘错误样例与“劳动任务决策树”无关。</text>
</svg>
